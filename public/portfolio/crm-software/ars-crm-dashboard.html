document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"2fcfd357-0ddb-4635-b65f-14953ac0371a\"><\u002Fscript>\n<style>\n  * { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; }\n  body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #f1f5f9; color: #0f172a; -webkit-font-smoothing: antialiased; }\n  .ars-nav:hover { background: rgba(255,255,255,0.06) !important; }\n  .ars-row:hover { background: #f8fafc !important; }\n  .ars-menu-item:hover { background: #f1f5f9 !important; }\n  .ars-card { transition: transform .12s, box-shadow .12s; }\n  .ars-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(15,23,42,0.12) !important; }\n  ::-webkit-scrollbar { width: 10px; height: 10px; }\n  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; border: 3px solid #f1f5f9; }\n  @keyframes arsFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }\n  .ars-demo:hover { background: #172033 !important; border-color: #334155 !important; }\n  .ars-nav-page:hover { background: #f8fafc !important; }\n  .ars-act { transition: all .12s; }\n  .ars-act:hover { background:#f1f5f9 !important; color:#0f172a !important; border-color:#cbd5e1 !important; }\n  .ars-act-del:hover { background:#fef2f2 !important; color:#dc2626 !important; border-color:#fecaca !important; }\n  .ars-sidebar { transition: transform .25s ease; }\n  .ars-hamburger { display: none; }\n  .ars-overlay { display: none; }\n  @media (max-width: 1024px) {\n    .ars-kpis { grid-template-columns: repeat(2,1fr) !important; }\n    .ars-split { grid-template-columns: 1fr !important; }\n    .ars-pipeline { grid-template-columns: none !important; grid-auto-flow: column; grid-auto-columns: 78%; overflow-x: auto; }\n  }\n  @media (max-width: 860px) {\n    .ars-sidebar { position: fixed !important; top:0; left:0; z-index:60; transform: translateX(-100%); box-shadow: 0 20px 60px rgba(0,0,0,0.5); }\n    .ars-sidebar.open { transform: none; }\n    .ars-hamburger { display: inline-flex !important; }\n    .ars-overlay.show { display: block; }\n    .ars-search { display: none !important; }\n    .ars-usertext { display: none !important; }\n    .ars-header { padding: 0 16px !important; gap: 12px !important; }\n    .ars-main { padding: 18px 16px 40px !important; }\n    .ars-tablecard { min-width: 780px; }\n  }\n  @media (max-width: 560px) {\n    .ars-kpis { grid-template-columns: 1fr !important; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<!-- ================= LOGIN ================= -->\n<sc-if value=\"{{ showLogin }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:radial-gradient(1200px 600px at 20% -10%, #1e293b 0%, #0b1120 55%);\">\n    <div style=\"width:430px; max-width:100%; background:#0f172a; border:1px solid #1e293b; border-radius:22px; padding:36px; box-shadow:0 40px 90px rgba(0,0,0,0.55); animation:arsFade .4s ease;\">\n      <div style=\"display:flex; align-items:center; gap:12px; margin-bottom:26px;\">\n        <div style=\"width:44px; height:44px; border-radius:12px; background:{{ accent }}; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 22px {{ accentGlow }};\">\n          <i data-lucide=\"hexagon\" style=\"width:23px; height:23px; color:#fff;\"><\u002Fi>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:19px; font-weight:800; color:#fff; letter-spacing:-0.02em;\">ARS CRM<\u002Fdiv>\n          <div style=\"font-size:11px; font-weight:600; color:#64748b; letter-spacing:0.08em;\">AI-BASED CRM FOR SOFTWARE HOUSES<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"font-size:22px; font-weight:800; color:#fff; letter-spacing:-0.02em;\">Welcome back<\u002Fdiv>\n      <div style=\"font-size:13px; color:#94a3b8; margin-top:5px; margin-bottom:22px;\">Sign in to your workspace to continue.<\u002Fdiv>\n\n      <label s               <i data-lucide=\"{{ k.icon }}\" style=\"width:20px; height:20px; color:{{ k.iconColor }};\"><\u002Fi>\n              <\u002Fdiv>\n              <div style=\"display:flex; align-items:center; gap:4px; font-size:12px; font-weight:700; color:{{ k.deltaColor }}; background:{{ k.deltaBg }}; padding:4px 8px; border-radius:20px;\">\n                <i data-lucide=\"{{ k.deltaIcon }}\" style=\"width:13px; height:13px;\"><\u002Fi>{{ k.delta }}\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:28px; font-weight:800; letter-spacing:-0.03em; font-family:'JetBrains Mono',monospace;\">{{ k.value }}<\u002Fdiv>\n            <div style=\"font-size:13px; color:#64748b; font-weight:500; margin-top:4px;\">{{ k.label }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <!-- ALLOCATION + MATCHMAKER -->\n      <div class=\"ars-split\" style=\"display:grid; grid-template-columns:1.7fr 1fr; gap:18px;\">\n\n        <!-- DEVELOPER ALLOCATION -->\n        <div style=\"background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:22px;\">\n          <div style=\"display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:6px;\">\n            <div>\n              <div style=\"font-size:15px; font-weight:700;\">Developer Allocation<\u002Fdiv>\n              <div style=\"font-size:12px; color:#64748b; margin-top:3px;\">Current workload across your team this sprint<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex; gap:14px; font-size:11.5px; font-weight:600; color:#64748b;\">\n              <span style=\"display:flex; align-items:center; gap:6px;\"><span style=\"width:8px; height:8px; border-radius:50%; background:#f59e0b;\"><\u002Fspan>{{ benchedCount }} benched<\u002Fspan>\n              <span style=\"display:flex; align-items:center; gap:6px;\"><span style=\"width:8px; height:8px; border-radius:50%; background:#dc2626;\"><\u002Fspan>{{ overCount }} ove   payInvoice = (e) => {\n    if (e && e.preventDefault) e.preventDefault();\n    const price = this.state.store.planPrice;\n    const now = new Date();\n    const inv = { id: 'INV-2026-' + String(7 + this.state.store.invoices.length - 4).padStart(3, '0'), date: 'Jul 06, 2026', amount: '$' + price.toLocaleString() };\n    this.setState(s => ({ store: { ...s.store, extraRevenue: s.store.extraRevenue + price / 1000, invoices: [inv, ...s.store.invoices] } }));\n    this.flash('Invoice paid — $' + price.toLocaleString() + ' pushed to platform MRR');\n  };\n  upgradePlan = (e) => {\n    if (e && e.preventDefault) e.preventDefault();\n    this.setState(s => ({ store: { ...s.store, planName: 'Enterprise Plus', planPrice: 2499, extraRevenue: s.store.extraRevenue + 1.0 } }));\n    this.flash('Plan upgraded — +$1,000 MRR to platform');\n  };\n  purchaseCredits = (e) => {\n    if (e && e.preventDefault) e.preventDefault();\n    this.setState(s => ({ store: { ...s.store, aiCredits: s.store.aiCredits + 2500, extraRevenue: s.store.extraRevenue + 0.25 } }));\n    this.flash('+2,500 AI credits — $250 added to platform revenue');\n  };\n  rowAction = (label) => (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ openMenu: null }); this.flash(label + ' action triggered'); };\n\n  get accounts() {\n    return {\n      'superadmin@arscrm.com': { role: 'super',   name: 'Alex Rivera',  title: 'Super Admin',      init: 'AR' },\n      'company@arscrm.com':    { role: 'admin',   name: 'Bilal Ahmed',  title: 'Company Owner',    init: 'BA' },\n      'manager@arscrm.com':    { role: 'manager', name: 'Sara Kim',     title: 'Project Manager',  init: 'SK' },\n      'seller@arscrm.com':     { role: 'seller',  name: 'Marcus Reed',  title: 'Sales Rep',        init: 'MR' },\n    };\n  }\n  doLogin = () => {\n    const email = (this.state.email || '').trim().toLowerCase();\n    const acc = this.accounts[email];\n    if (!acc) { this.setState({ loginError: 'No account found for that email. Try a demo account below.' }); return; }\n    this.setState({ authed: true, user: { email, ...acc }, view: acc.role, active: 'dashboard', profileOpen: false, loginError: '', draft: this.seedDraft({ email, ...acc }) });\n  };\n  logout = (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ authed: false, user: null, password: '', profileOpen: false }); };\n\n  componentDidMount() {\n    this.renderIcons();\n    this._onDoc = () => {\n      if (this.state.profileOpen) this.setState({ profileOpen: false });\n      if (this.state.openMenu != null) this.setState({ openMenu: null });\n    };\n    document.addEventListener('click', this._onDoc);\n  }\n  componentWillUnmount() { document.removeEventListener('click', this._onDoc); }\n  componentDidUpdate() { this.renderIcons(); }\n\n  renderIcons() {\n    const go = () => { try { window.lucide && window.lucide.createIcons(); } catch (e) {} };\n    go();\n    if (!window.lucide && !this._poll) {\n      let n = 0;\n      this._poll = setInterval(() => { if (window.lucide) { go(); clearInterval(this._poll); this._poll = null; } if (++n > 60) { clearInterval(this._poll); this._poll = null; } }, 60);\n    }\n  }\n\n  renderVals() {\n    const accent = this.props.accentColor ?? '#3b82f6';\n    const accentSoft = 'rgba(59,130,246,0.10)';\n    const range = this.props.chartRange ?? '12M';\n    const view = this.state.view;\n    const isSuper = view === 'super';\n    const isAdmin = view === 'admin';\n    const isManager = view === 'manager';\n    const isSeller = view === 'seller';\n    const dash = this.state.active === 'dashboard';\n    const user = this.state.user;\n\n    const navSuper = [\n      { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },\n      { id: 'companies', label: 'Companies', icon: 'building-2', badge: '1.2K' },\n      { id: 'subscriptions', label: 'Subscriptions', icon: 'credit-card' },\n      { id: 'ai', label: 'AI System Health', icon: 'activity' },\n      { id: 'settings', label: 'Settings', icon: 'settings' },\n    ];\n    const navAdmin = [\n      { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },\n      { id: 'projects', label: 'Projects', icon: 'folder-kanban', badge: '24' },\n      { id: 'team', label: 'Developers / Team', icon: 'users' },\n      { id: 'clients', label: 'Clients', icon: 'briefcase' },\n      { id: 'analytics', label: 'AI Analytics', icon: 'brain-circuit' },\n      { id: 'settings', label: 'Settings', icon: 'settings' },\n    ];\n    const navManager = [\n      { id: 'dashboard', label: 'My Projects', icon: 'folder-kanban', badge: '6' },\n      { id: 'capacity', label: 'Team Capacity', icon: 'gauge' },\n      { id: 'sprint', label: 'Sprint Planner', icon: 'calendar-range' },\n      { id: 'allocator', label: 'AI Resource Allocator', icon: 'brain-circuit' },\n      { id: 'reports', label: 'Reports', icon: 'bar-chart-3' },\n    ];\n    const navSeller = [\n      { id: 'dashboard', label: 'Pipeline', icon: 'kanban' },\n      { id: 'leads', label: 'Leads', icon: 'user-search' },\n      { id: 'outreach', label: 'Outreach', icon: 'send' },\n      { id: 'proposals', label: 'Proposals', icon: 'file-text', badge: '32' },\n      { id: 'meetings', label: 'Meetings', icon: 'calendar-check' },\n    ];\n    const navByView = { super: navSuper, admin: navAdmin, manager: navManager, seller: navSeller };\n    const navDefs = navByView[view];\n    const nav = navDefs.map(n => {\n      const on = this.state.active === n.id;\n      return {\n        ...n,\n        style: `display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:10px; text-decoration:none; font-size:13.5px; font-weight:600; cursor:pointer; transition:background .15s; ${on ? `background:${accent}; color:#fff; box-shadow:0 6px 16px ${this.hexA(accent,0.32)};` : 'background:transparent; color:#94a3b8;'}`,\n        onClick: (e) => { e.preventDefault(); this.setState({ active: n.id, sidebarOpen: false }); },\n      };\n    });\n\n    const menuDefs = [\n      { label: 'Profile Settings', icon: 'user', color: '#334155', go: 'profile' },\n      { label: 'Billing', icon: 'credit-card', color: '#334155', go: 'billing' },\n      { label: 'Logout', icon: 'log-out', color: '#dc2626', sign: true },\n    ];\n    const menu = menuDefs.map(m => ({ ...m, onClick: m.sign ? this.logout : (e) => { e.preventDefault(); this.setState({ active: m.go, profileOpen: false, sidebarOpen: false, draft: this.seedDraft(this.state.user) }); } }));\n\n    const store = this.state.store;\n    const mrrK = 427.6 + store.extraRevenue;\n    const mrrStr = '$' + mrrK.toFixed(1) + 'K';\n    const annualRunRate = '$' + (mrrK * 12 / 1000).toFixed(2) + 'M';\n    const creditPct = Math.min(100, Math.round(store.aiCredits / store.aiCreditsMax * 100));\n    const creditRing = 'conic-gradient(' + accent + ' ' + (creditPct * 3.6) + 'deg, #e2e8f0 ' + (creditPct * 3.6) + 'deg)';\n    const draft = this.state.draft;\n\n    const kpis = [\n      { label: 'Total Companies', value: '1,284', icon: 'building-2', iconBg: this.hexA(accent,0.12), iconColor: accent, delta: '12.4%', deltaIcon: 'trending-up', deltaColor: '#16a34a', deltaBg: 'rgba(22,163,74,0.10)' },\n      { label: 'Active Users', value: '38,902', icon: 'users', iconBg: 'rgba(139,92,246,0.12)', iconColor: '#8b5cf6', delta: '8.1%', deltaIcon: 'trending-up', deltaColor: '#16a34a', deltaBg: 'rgba(22,163,74,0.10)' },\n      { label: 'Global MRR', value: mrrStr, icon: 'dollar-sign', iconBg: 'rgba(16,185,129,0.12)', iconColor: '#10b981', delta: '5.7%', deltaIcon: 'trending-up', deltaColor: '#16a34a', deltaBg: 'rgba(22,163,74,0.10)' },\n      { label: 'AI Token Usage', value: '2.9B', icon: 'zap', iconBg: 'rgba(245,158,11,0.12)', iconColor: '#f59e0b', delta: '18.3%', deltaIcon: 'trending-up', deltaColor: '#d97706', deltaBg: 'rgba(245,158,11,0.12)' },\n    ];\n\n    const barData = [\n      { m: 'Jul', h: 30 }, { m: 'Aug', h: 38 }, { m: 'Sep', h: 34 }, { m: 'Oct', h: 47 },\n      { m: 'Nov', , sub: 'datastream.co · 9 seats', initials: 'DS', avBg: 'rgba(6,182,212,0.12)', avColor: '#06b6d4', plan: 'Starter', s: 'trial', u: 28 },\n    ];\n    const companies = companyDefs.map(c => ({\n      name: c.name, sub: c.sub, initials: c.initials, avBg: c.avBg, avColor: c.avColor, plan: c.plan,\n      ...st[c.s], usage: c.u + '%', usageFill: uf(c.u),\n    }));\n\n    // ---------- ADMIN VIEW DATA ----------\n    const akpis = [\n      { label: 'Active Projects', value: '24', icon: 'folder-kanban', iconBg: this.hexA(accent,0.12), iconColor: accent, delta: '+3', deltaIcon: 'trending-up', deltaColor: '#16a34a', deltaBg: 'rgba(22,163,74,0.10)' },\n      { label: 'Total Developers', value: '68', icon: 'users', iconBg: 'rgba(139,92,246,0.12)', iconColor: '#8b5cf6', delta: '+5', deltaIcon: 'trending-up', deltaColor: '#16a34a', deltaBg: 'rgba(22,163,74,0.10)' },\n      { label: 'Monthly Billed Hours', value: '9,240h', icon: 'clock', iconBg: 'rgba(16,185,129,0.12)', iconColor: '#10b981', delta: '6.2%', deltaIcon: 'trending-up', deltaColor: '#16a34a', deltaBg: 'rgba(22,163,74,0.10)' },\n      { label: 'AI-Predicted Revenue', value: '$312.8K', icon: 'sparkles', iconBg: 'rgba(245,158,11,0.12)', iconColor: '#f59e0b', delta: 'proj.', deltaIcon: 'wand-sparkles', deltaColor: '#d97706', deltaBg: 'rgba(245,158,11,0.12)' },\n    ];\n\n    const insights = [\n      { icon: 'alert-triangle', tone: '#dc2626', bg: 'rgba(220,38,38,0.08)', tag: 'Deadline Risk', title: 'SleepMetrics is at risk of missing its deadline', body: 'Developer commit velocity dropped 34% over the last 2 sprints. Projected slip: 9 days.', action: 'Rebalance sprint' },\n      { icon: 'user-minus', tone: '#d97706', bg: 'rgba(245,158,11,0.09)', tag: 'Churn Signal', title: 'Client Vertex has a high churn probability', body: 'Support sentiment down and login frequency −52% MoM. Churn likelihood 71%.', action: 'Schedule check-in' },\n      { icon: 'lightbulb', tone: accent, bg: this.hexA(accent,0.08), tag: 'Opportunity', t cent)]),\n          row([T('Fix PHP checkout race condition'), T('Spec 2.0 Checkout'), AV('AR', 'Abdul Rehman', '', '#10b981'), T('8'), B('In Review', VIOLET)]),\n          row([T('Regression suite for payments'), T('Series C Payments'), AV('F', 'Fahad', '', VIOLET), T('3'), B('To Do', SLATE)]),\n          row([T('Social login OAuth flow'), T('Spec 3 Marketplace'), AV('A', 'Asad', '', PINK), T('5'), B('Blocked', RED)]),\n          row([T('Cart persistence bug'), T('Series A Storefront'), AV('AR', 'Abdul Rehman', '', '#10b981'), T('2'), B('Done', GREEN)]),\n        ]);\n      case 'manager:allocator':\n        return cards('AI Resource Allocator', 'AI-matched staffing recommendations',\n          [metric('inbox', 'Open Requests', '4', accent), metric('user-minus', 'Benched Devs', '1', '#f59e0b'), metric('user-plus', 'Overbooked', '1', RED), metric('target', 'Match Accuracy', '94%', GREEN)],\n          'AI Recommendations', [\n          item('sparkles', accent, 'Match', 'Assign Asad to Series B Inventory API', '32% capacity free · strong social/API skill fit · 82% past success.'),\n          item('alert-triangle', RED, 'Overload', 'Abdul Rehman is at 112% utilization', 'Move 2 checkout tasks to Fahad to relieve the bottleneck.'),\n          item('lightbulb', accent, 'Rebalance', 'Fahad can absorb QA overflow', '+36% capacity available this sprint for regression work.'),\n        ]);\n      case 'manager:reports':\n        return cards('Reports', 'Delivery and velocity reporting',\n          [metric('zap', 'Sprint Velocity', '42 pts', VIOLET), metric('activity', 'Throughput', '31 tasks', accent), metric('timer', 'Avg Cycle Time', '2.4d', GREEN), metric('bug', 'Bug Rate', '4.2%', '#f59e0b')],\n          'Recent Reports', [\n          item('file-text', accent, 'Weekly', 'Sprint 24 Summary', 'Velocity +9.5% vs last sprint · 2 delivery risks flagged.'),\n          item('file-text', accent, 'Monthly', 'June Delivery Report', '92% on-time delivery · 34% average project margin.'),\n          item('file-text', accent, 'Quarterly', 'Q2 Team Performance', 'Utilization 86% · 1,240 hours saved via AI assistance.'),\n        ]);\n\n      // ---------------- SELLER ----------------\n      case 'seller:leads':\n        return table('Leads', 'Inbound and outbound prospects', 'Add lead', '1.8fr 1.1fr 0.9fr 1fr 1fr',\n          ['LEAD', 'SOURCE', 'AI SCORE', 'VALUE', 'STATUS'], [\n          row([AV('RX', 'Retailer X', 'E-commerce App', accent), T('Inbound'), SC(62), M('$85K'), B('New', SLATE)]),\n          row([AV('LC', 'LogiCore', 'Fleet Tracking SaaS', CYAN), T('Referral'), SC(73), M('$120K'), B('Qualified', GREEN)]),\n          row([AV('FB', 'FinBridge', 'Payments Integration', VIOLET), T('Outbound'), SC(79), M('$210K'), B('Qualified', GREEN)]),\n          row([AV('ZS', 'Zenith Spa', 'Booking Platform', PINK), T('Inbound'), SC(58), M('$55K'), B('New', SLATE)]),\n          row([AV('HN', 'HelpNest', 'AI Chatbot', '#f59e0b'), T('Event'), SC(66), M('$95K'), B('Nurturing', AMBER)]),\n        ]);\n      case 'seller:outreach':\n        return table('Outreach', 'Active conversations and next steps', 'New sequence', '1.7fr 1fr 1fr 1.2fr 1.5fr',\n          ['CONTACT', 'CHANNEL', 'LAST TOUCH', 'STATUS', 'NEXT STEP'], [\n          row([AV('RX', 'Retailer X', 'VP Engineering', accent), T('Email'), T('2d ago'), B('Awaiting reply', AMBER), T('Send AWS case study')]),\n          row([AV('LC', 'LogiCore', 'CTO', CYAN), T('LinkedIn'), T('5h ago'), B('Replied', GREEN), T('Book discovery call')]),\n          row([AV('FB', 'FinBridge', 'Head of Product', VIOLET), T('Call'), T('1d ago'), B('Connected', GREEN), T('Share security doc')]),\n          row([AV('BZ', 'Bazaaro', 'Founder', '#f59e0b'), T('Email'), T('4d ago'), B('No response', RED), T('Try alternate contact')]),\n        ]);\n      case 'seller:proposals':\n        return table('Proposals', 'Statements of work sent to prospects', 'New proposal', '1.9fr 1.2fr 1fr 1fr 1fr',\n          ['PROPOSAL', 'CLIENT', 'VALUE', 'SENT', 'STATUS'], [\n          row([T('Mobile Banking App — SOW'), T('Vault21'), M('$340K'), T('Jun 24'), B('In Review', VIOLET)]),\n          row([T('Marketplace Rebuild — SOW'), T('Bazaaro'), M('$160K'), T('Jun 20'), B('Sent', accent)]),\n          row([T('Payments Integration — SOW'), T('FinBridge'), M('$210K'), T('Jun 18'), B('Negotiation', AMBER)]),\n          row([T('Fleet Tracking — SOW'), T('LogiCore'), M('$120K'), T('Jun 12'), B('Won', GREEN)]),\n          row([T('CRM Migration — SOW'), T('Oldline Co'), M('$70K'), T('Jun 05'), B('Lost', RED)]),\n        ]);\n      case 'seller:meetings':\n        return table('Meetings', 'Upcoming and recent client meetings', 'Schedule', '1.9fr 1.3fr 1.2fr 1fr 1fr',\n          ['MEETING', 'CLIENT', 'DATE', 'TYPE', 'STATUS'], [\n          row([T('Discovery Call'), T('Retailer X'), T('Jul 03 · 10:00'), B('Discovery', accent), B('Scheduled', GREEN)]),\n          row([T('Technical Scoping'), T('LogiCore'), T('Jul 03 · 14:30'), B('Scoping', VIOLET), B('Scheduled', GREEN)]),\n          row([T('Proposal Review'), T('Vault21'), T('Jul 05 · 11:00'), B('Proposal', AMBER), B('Confirmed', GREEN)]),\n          row([T('Project Kickoff'), T('LogiCore'), T('Jun 28 · 09:00'), B('Kickoff', GREEN), B('Completed', SLATE)]),\n        ]);\n\n      default:\n        return cards(active, 'This section is ready for content.', [], '', []);\n    }\n  }\n\n  hexA(hex, a) {\n    const h = hex.replace('#', '');\n    const r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);\n    return `rgba(${r},${g},${b},${a})`;\n  }\n  hexA2(hex, a) { return this.hexA(hex, a); }\n  tabStyle(on, accent) {\n    return `display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:700; padding:7px 14px; border-radius:8px; border:none; cursor:pointer; transition:all .15s; ${on ? `background:#fff; color:${accent}; box-shadow:0 1px 3px rgba(15,23,42,0.12);` : 'background:transparent; color:#64748b;'}`;\n  }\n\n  matchDeveloper(text, roster, accent) {\n    const q = (text || '').toLowerCase();\n    if (!q.trim()) return null;\n    const skillKeys = ['python','react','node','go','flutter','firebase'];\n    const wantSkills = skillKeys.filter(s => q.includes(s));\n    let wantLevel = 0;\n    if (/senior|lead|sr\\b/.test(q)) wantLevel = 3;\n    else if (/mid|intermediate/.test(q)) wantLevel = 2;\n    else if (/junior|jr\\b|entry/.test(q)) wantLevel = 1;\n\n    const scored = roster.map(d => {\n      let s = 0; const reasons = [];\n      const skillHit = wantSkills.filter(w => d.skills.includes(w));\n      if (wantSkills.length) {\n        s += (skillHit.length / wantSkills.length) * 50;\n        if (skillHit.length) reasons.push(skillHit.map(x=>x[0].toUpperCase()+x.slice(1)).join(' + ') + ' match');\n      } else { s += 25; }\n      if (wantLevel) {\n        s += Math.max(0, 20 - Math.abs(d.level - wantLevel) * 12);\n        if (d.level === wantLevel) reasons.push('seniority fit');\n      } else { s += 12; }\n      const avail = Math.max(0, 100 - d.load);\n      s += (avail / 100) * 20;\n      if (d.load < 60) reasons.push(avail + '% capacity free');\n      else if (d.load >= 100) reasons.push('currently overbooked');\n      s += (d.success / 100) * 10;\n      reasons.push(d.success + '% past success');\n      return { d, score: Math.round(s), reasons };\n    }).sort((a,b) => b.score - a.score);\n\n    const top = scored[0];\n    const conf = Math.min(99, Math.max(40, top.score));\n    return {\n      name: top.d.name, init: top.d.init, role: top.d.role, color: top.d.color,\n      avBg: this.hexA(top.d.color, 0.16),\n      score: conf + '%',\n      load: top.d.load + '% utilized',\n      success: top.d.success + '%',\n      available: top.d.load >= 100 ? 'Overbooked' : (100 - top.d.load) + '% free',\n      availColor: top.d.load >= 100 ? '#dc2626' : (top.d.load < 60 ? '#16a34a' : '#d97706'),\n      reason: top.reasons.slice(0, 3).join(' · '),\n      alt: scored[1] ? scored[1].d.name : null,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
